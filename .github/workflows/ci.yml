name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*.*.*' ]

jobs:
  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Dependencies
        run: |
          uv sync

      - name: Build App with PyInstaller
        run: |
          uv run pyinstaller --name "ColorGrabber" \
                      --windowed \
                      --noconsole \
                      --icon ".github/assets/icon.icns" \
                      --add-data "standalone.html:." \
                      --add-data ".github/assets/icon.png:." \
                      color_grabber.py

      - name: Zip Application Bundle
        run: |
          cd dist
          zip -r ColorGrabber.zip ColorGrabber.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ColorGrabber-macOS
          path: dist/ColorGrabber.zip
          retention-days: 7

  generate-docs:
    name: Generate and Commit Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Docs Directory
        run: mkdir -p docs

      - name: Convert README to PDF
        uses: Isratech-Software/markdown-to-pdf-action@v1
        with:
          input_file: 'README.md'
          output_file: 'docs/README.pdf'
          logo_file: '.github/assets/logo.png'
          css_file: '.github/assets/styles.css'

      - name: Commit and Push Generated PDF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f docs/README.pdf
          
          if ! git diff-index --quiet HEAD docs/README.pdf; then
            git commit -m "docs: auto-generate PDF from README"
            git push
          else
            echo "No changes detected. Skipping commit."
          fi

  create-release:
    name: Create Named Release
    runs-on: ubuntu-latest
    needs: [build-macos]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ColorGrabber-macOS
          path: dist/

      - name: Resolve Release Tag
        id: resolve_tag
        run: |
          if [[ ${{ github.ref }} == refs/tags/* ]]; then
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG_NAME=v$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.TAG_NAME }}
          name: Release ${{ steps.resolve_tag.outputs.TAG_NAME }}
          files: dist/ColorGrabber.zip
          generate_release_notes: true
